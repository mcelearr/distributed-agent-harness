[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-agent-harness"
version = "0.1.0"
description = "A framework for building distributed multi-agent systems with shared, auditable world state"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

# Runtime extras for SDK users.
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
# Core dev dependencies — needed to run the SDK test suite.
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]
# Extra dependencies needed by the bundled examples (the web console
# example needs FastAPI + uvicorn). Examples are NOT part of the published
# wheel; this group is for local development of the repo only.
examples = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[tool.pytest.ini_options]
# Discover both the small SDK suite and the per-example tests that live
# next to each example.
testpaths = ["tests", "examples"]
asyncio_mode = "auto"

# Only the SDK ships. `examples/` is intentionally excluded — those are
# reference implementations, not part of the public package.
[tool.setuptools.packages.find]
where = ["."]
include = ["distributed_agent_harness*"]
exclude = ["examples*", "tests*"]
