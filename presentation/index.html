<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distributed Agent Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#0A0E1A;
  --bg2:#0E1424;
  --surface:#141B30;
  --surface2:#1A2440;
  --border:#283456;
  --ink:#E8ECF6;
  --muted:#8B96B4;
  --cyan:#5BD1FF;
  --gold:#F2B544;
  --green:#54E08A;
  --red:#FB7185;
  --amber:#FBBF24;
  --purple:#A78BFA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070E;overflow:hidden;font-family:'Inter',system-ui,sans-serif}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center}
.slide{
  position:absolute;inset:0;background:
    radial-gradient(1200px 500px at 85% -10%, rgba(91,209,255,0.06), transparent 60%),
    radial-gradient(900px 500px at -5% 110%, rgba(242,181,68,0.05), transparent 60%),
    linear-gradient(160deg,var(--bg) 0%, var(--bg2) 100%);
  color:var(--ink);padding:52px 60px;display:none;flex-direction:column;
  border:1px solid #11182B;overflow:hidden;
}
.slide.active{display:flex}
.kicker{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2px;
  text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:10px}
.kicker .num{color:var(--muted)}
.kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;line-height:1.08;margin-top:14px;letter-spacing:-0.5px}
h1.big{font-size:60px}
.sub{font-size:18px;color:var(--muted);margin-top:12px;max-width:920px;line-height:1.5}
.firm-chip{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--gold);background:rgba(242,181,68,0.10);border:1px solid rgba(242,181,68,0.30);
  padding:5px 12px;border-radius:999px;letter-spacing:0.5px}
.firm-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.foot{position:absolute;bottom:20px;right:26px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#4A567A}
.foot .t{color:var(--muted)}
.progress{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .25s}

/* layout helpers */
.row{display:flex;gap:20px}
.col{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grow{flex:1}
.center{align-items:center}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.card.tight{padding:14px 16px}
.card h3{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.card p{font-size:14.5px;color:var(--muted);line-height:1.5}
.icoCircle{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0}
.ic-cyan{background:rgba(91,209,255,0.15);color:var(--cyan)}
.ic-gold{background:rgba(242,181,68,0.15);color:var(--gold)}
.ic-green{background:rgba(84,224,138,0.15);color:var(--green)}
.ic-red{background:rgba(251,113,133,0.15);color:var(--red)}
.ic-purple{background:rgba(167,139,250,0.15);color:var(--purple)}

ul.clean{list-style:none;display:flex;flex-direction:column;gap:11px}
ul.clean li{font-size:15.5px;line-height:1.45;padding-left:22px;position:relative;color:var(--ink)}
ul.clean li::before{content:"▸";position:absolute;left:0;color:var(--cyan);font-size:14px}
ul.clean li b{color:var(--ink);font-weight:600}
ul.clean li .m{color:var(--muted)}

.label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

pre{background:#0A1020;border:1px solid #20294A;border-radius:10px;padding:13px 15px;overflow:hidden}
pre code{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5;background:none!important;padding:0!important}
code.inl{font-family:'JetBrains Mono',monospace;font-size:0.92em;color:var(--cyan);background:rgba(91,209,255,0.10);padding:1px 6px;border-radius:5px}
.hljs{background:none!important}

table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th,table.cmp td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
table.cmp th{font-family:'Space Grotesk';font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
table.cmp td.cap{font-weight:500;color:var(--ink);font-size:13px}
table.cmp .yes{color:var(--green);font-weight:600}
table.cmp .no{color:var(--red)}
table.cmp .part{color:var(--amber)}
table.cmp tr td:nth-child(2){background:rgba(91,209,255,0.06)}

/* flow boxes */
.flowbox{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;
  font-size:14px;font-weight:500;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.arrow{color:var(--cyan);font-size:20px;display:flex;align-items:center}
.arrow.down{transform:rotate(90deg)}

.bad{border-color:rgba(251,113,133,0.4)}
.good{border-color:rgba(84,224,138,0.4)}
.bad h3 .icoCircle{background:rgba(251,113,133,0.15);color:var(--red)}

/* tree */
.tree{font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.85;color:var(--ink);white-space:pre}
.tree .d{color:var(--gold)}
.tree .c{color:var(--muted)}

.mini h3{font-size:13px;margin-bottom:6px;color:var(--cyan);font-family:'JetBrains Mono',monospace;letter-spacing:0.5px}
.mini pre{padding:9px 11px}
.mini pre code{font-size:11px;line-height:1.45}

.decision{border-radius:12px;padding:16px 18px;border:1px solid;display:flex;flex-direction:column;gap:8px}
.d-cont{border-color:rgba(84,224,138,0.5);background:rgba(84,224,138,0.05)}
.d-rec{border-color:rgba(251,191,36,0.5);background:rgba(251,191,36,0.05)}
.d-aba{border-color:rgba(251,113,133,0.5);background:rgba(251,113,133,0.05)}
.decision .dt{font-family:'Space Grotesk';font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.d-cont .dt{color:var(--green)} .d-rec .dt{color:var(--amber)} .d-aba .dt{color:var(--red)}
.decision .ds{font-size:13.5px;color:var(--muted);line-height:1.45}
.decision .dc{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);background:#0A1020;border:1px solid #20294A;border-radius:7px;padding:7px 9px}

.statbig{font-family:'Space Grotesk';font-weight:700;font-size:46px;color:var(--cyan);line-height:1}
.note{font-size:13px;color:var(--muted);font-style:italic}

.tag{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600}
.t-yes{background:rgba(84,224,138,0.12);color:var(--green)}
.t-no{background:rgba(251,113,133,0.12);color:var(--red)}

.hl-cyan{color:var(--cyan)} .hl-gold{color:var(--gold)} .hl-green{color:var(--green)} .hl-red{color:var(--red)}

.bignum{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--gold)}
.two-offset{display:flex;gap:14px;align-items:stretch}
.writer{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface)}
.writer .wt{font-family:'JetBrains Mono';font-size:12px;color:var(--muted);margin-bottom:6px}
.offtag{font-family:'JetBrains Mono';font-size:12px;padding:2px 8px;border-radius:5px;background:#0A1020;border:1px solid #20294A;display:inline-block;margin-top:4px}

/* ── animated data path (slide 04) ── */
.dp-track{position:relative;height:300px;width:1090px;margin:0 auto}
.dp-line{position:absolute;left:78px;width:912px;top:198px;height:2px;
  background:linear-gradient(90deg,var(--border),#36436e,var(--border))}
.dp-conn{position:absolute;border-left:2px dashed var(--border)}
.dp-node{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:11px 12px;text-align:center;transition:box-shadow .25s,border-color .25s;z-index:3}
.dp-node .nt{font-family:'Space Grotesk';font-weight:600;font-size:14px;line-height:1.1}
.dp-node .ns{font-size:10.5px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono'}
.dp-node.hub{border-color:rgba(91,209,255,0.4)}
.dp-node.glow{border-color:var(--cyan);box-shadow:0 0 26px rgba(91,209,255,0.45)}
.dp-node.glow-g{border-color:var(--green);box-shadow:0 0 26px rgba(84,224,138,0.45)}
.dp-badge{position:absolute;background:var(--surface2);border:1px dashed var(--border);border-radius:10px;
  padding:9px 11px;text-align:center;transition:box-shadow .25s,border-color .25s;z-index:3}
.dp-badge .nt{font-family:'Space Grotesk';font-weight:600;font-size:13px;color:var(--gold);line-height:1.1}
.dp-badge .ns{font-size:10px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono'}
.dp-badge.cr .nt{color:var(--amber)}
.dp-badge.glow{border-style:solid;border-color:var(--gold);box-shadow:0 0 24px rgba(242,181,68,0.4)}
.dp-badge.cr.glow{border-color:var(--amber);box-shadow:0 0 24px rgba(251,191,36,0.45)}
.dp-packet{position:absolute;top:198px;transform:translate(-50%,-50%);padding:5px 11px;border-radius:999px;
  font-family:'JetBrains Mono';font-size:11.5px;font-weight:600;white-space:nowrap;z-index:6;
  transition:left .66s linear,opacity .3s}
.dp-packet.cyan{background:rgba(91,209,255,0.16);color:var(--cyan);border:1px solid var(--cyan)}
.dp-packet.gold{background:rgba(242,181,68,0.16);color:var(--gold);border:1px solid var(--gold)}
.dp-packet.red{background:rgba(251,113,133,0.16);color:var(--red);border:1px solid var(--red)}
.dp-packet.conflict{animation:dpshake .28s 2}
@keyframes dpshake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-50%,-50%) rotate(-4deg)}75%{transform:translate(-50%,-50%) rotate(4deg)}}
.dp-we{position:absolute;border:1.5px dashed rgba(242,181,68,0.55);border-radius:14px;
  background:rgba(242,181,68,0.05);z-index:2}
.dp-we-tab{position:absolute;top:-12px;left:16px;font-family:'JetBrains Mono';font-size:11px;
  letter-spacing:0.5px;color:var(--gold);background:#141B30;border:1px solid rgba(242,181,68,0.45);
  border-radius:7px;padding:2px 9px;white-space:nowrap}
.dp-we-cap{position:absolute;font-family:'Inter';font-size:11.5px;font-style:italic;color:var(--gold);text-align:center}
.dp-readbus-h{position:absolute;border-top:1.5px dashed rgba(91,209,255,0.45)}
.dp-readbus-v{position:absolute;border-left:1.5px dashed rgba(91,209,255,0.45)}
.dp-readlabel{position:absolute;font-family:'JetBrains Mono';font-size:10.5px;color:var(--cyan);
  background:var(--bg2);padding:1px 8px;border-radius:6px;white-space:nowrap;transform:translateX(-50%)}
.dp-readdot{position:absolute;top:6px;width:9px;height:9px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 11px var(--cyan);transform:translate(-50%,-50%);transition:left .8s linear,opacity .3s;z-index:5}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>

<script>
const slides = [];
function S(html){ slides.push(html); }

/* ───────────────────────── 1 — TITLE / PROBLEM ───────────────────────── */
S(`
<div class="kicker"><span class="dot"></span> Distributed Agent Harness <span class="num">// technical spike</span></div>
<h1 class="big">When one agent on one machine<br>isn't the problem you have</h1>
<div class="sub">The classic harness — an LLM driving <code class="inl">bash</code> over a local filesystem (Claude Code, Cursor) — is a brilliant fit for <b style="color:var(--ink)">one agent, one machine</b>. It breaks the moment several agents and humans share the same business state.</div>
<div class="body">
  <div class="grid2" style="align-items:start">
    <div class="card bad">
      <h3><span class="icoCircle">✕</span> Point N agents at one document</h3>
      <div class="row" style="margin:6px 0 14px">
        <div class="col grow" style="gap:8px">
          <div class="flowbox">Agent 1</div><div class="flowbox">Agent 2</div>
        </div>
        <div class="arrow">→</div>
        <div class="flowbox" style="align-self:center">Shared<br>document</div>
      </div>
      <ul class="clean">
        <li><b>Race conditions</b> <span class="m">— simultaneous edits clobber each other</span></li>
        <li><b>No governance</b> <span class="m">— uncontrolled edits, no audit trail</span></li>
      </ul>
    </div>
    <div class="card good">
      <h3><span class="icoCircle ic-green">✓</span> Put a harness in the middle</h3>
      <div class="row" style="margin:6px 0 14px">
        <div class="col grow" style="gap:8px">
          <div class="flowbox">Agent 1</div><div class="flowbox">Agent 2</div>
        </div>
        <div class="arrow">→</div>
        <div class="flowbox" style="align-self:center;border-color:var(--cyan)">Harness</div>
        <div class="arrow">→</div>
        <div class="flowbox" style="align-self:center">State</div>
      </div>
      <ul class="clean">
        <li><b class="hl-cyan">Code-as-harness</b> <span class="m">— agents call only typed actions; every call audited</span></li>
        <li><b class="hl-gold">Agent-as-rebaser</b> <span class="m">— conflicts caught & resolved by the LLM</span></li>
      </ul>
    </div>
  </div>
</div>`);

/* ───────────────────────── 2 — THE USER ───────────────────────── */
S(`
<div class="kicker"><span class="num">// 02</span> <span class="dot"></span> The user</div>
<h1>Meet the user: a data protection practice</h1>
<div class="sub">A law firm acting as an outsourced <b style="color:var(--ink)">Data Protection Officer</b> under <span class="hl-gold">EU GDPR</span>.</div>
<div class="body">
  <div class="card" style="margin-bottom:18px;background:var(--surface2)">
    <div class="label">The engagement lifecycle — legal gates between every phase</div>
    <div class="row center" style="margin-top:6px">
      <div class="flowbox">Pitch</div><div class="arrow">→</div>
      <div class="flowbox">Contract <span class="c" style="color:var(--muted);font-size:11px">+ DPA, Art. 28</span></div><div class="arrow">→</div>
      <div class="flowbox">Privacy Policy</div><div class="arrow">→</div>
      <div class="col" style="gap:8px">
        <div class="flowbox" style="border-color:var(--gold)">Data Subject Requests</div>
        <div class="flowbox" style="border-color:var(--red)">Data Breaches</div>
      </div>
    </div>
  </div>
  <div class="grid2">
    <div class="card tight"><h3><span class="icoCircle ic-cyan">⇄</span> Multiplayer & concurrent</h3><p>A partner, a trainee, and a compliance agent all touch the same client file at the same time.</p></div>
    <div class="card tight"><h3><span class="icoCircle ic-gold">§</span> Every action has legal weight</h3><p>The supervisory authority can audit the firm. Nothing can be improvised or untraceable.</p></div>
    <div class="card tight"><h3><span class="icoCircle ic-green">▤</span> Phased, with hard gates</h3><p>Can't draft a policy before the contract; can't close a breach before notifying the authority.</p></div>
    <div class="card tight"><h3><span class="icoCircle ic-purple">⊞</span> Human-readable documents</h3><p>A partner must open and review the file directly — sign-off without vendor tooling.</p></div>
  </div>
</div>`);

/* ───────────────────────── 3 — FUNCTIONAL REQS ───────────────────────── */
S(`
<div class="kicker"><span class="num">// 03</span> <span class="dot"></span> Functional requirements</div>
<h1>What the firm needs from the system</h1>
<div class="firm-chip" style="margin-top:12px">Acme Health Ltd · outsourced DPO · EU GDPR</div>
<div class="body">
  <div class="grid2">
    <div class="card tight">
      <h3><span class="icoCircle ic-cyan">⇄</span> "Edit the same file at once, safely"</h3>
      <p>Many agents + humans write concurrently; no commit ever lands against a stale snapshot.</p>
    </div>
    <div class="card tight">
      <h3><span class="icoCircle ic-gold">§</span> "Survive an audit"</h3>
      <p>Every action is attributed to a principal, and the log is tamper-evident end to end.</p>
    </div>
    <div class="card tight">
      <h3><span class="icoCircle ic-green">{ }</span> "The agent must understand the action"</h3>
      <p>The LLM sees the signature, docstring <i>and the source body</i> — not just a name.</p>
    </div>
    <div class="card tight">
      <h3><span class="icoCircle ic-purple">⊞</span> "A partner can just read the file"</h3>
      <p>State at rest is Markdown / YAML / JSON. Never a binary blob.</p>
    </div>
    <div class="card tight">
      <h3><span class="icoCircle ic-cyan">⚡</span> "Develop locally, ship to production"</h3>
      <p>A domain is one Python class. The <i>same</i> class runs in-memory on a laptop and against Kafka + SharePoint in prod — iterate fast, then deploy. No rewrite.</p>
    </div>
    <div class="card tight">
      <h3><span class="icoCircle ic-gold">⚙</span> "Swap any backend, untouched domain"</h3>
      <p>Storage, event log and conflict resolver are pluggable interfaces — chosen at deploy time, never in the business logic.</p>
    </div>
  </div>
</div>`);

/* ───────────────────────── 4 — SYSTEM DESIGN (ANIMATED) ───────────────────────── */
S(`
<div class="kicker"><span class="num">// 04</span> <span class="dot"></span> System design</div>
<h1>The data path, in the firm's terms</h1>
<div class="body">
  <div class="card" style="background:var(--surface2);padding:18px 22px 14px">
    <div id="dp-track" class="dp-track">
      <div class="dp-line"></div>
      <div class="dp-conn" style="left:320px;top:62px;height:52px"></div>
      <div class="dp-conn" style="left:769px;top:180px;height:54px"></div>

      <!-- read path: namespace feeds the prompt builder every turn -->
      <div class="dp-readbus-v" style="left:985px;top:6px;height:108px"></div>
      <div class="dp-readbus-h" style="left:320px;width:665px;top:6px"></div>
      <div class="dp-readbus-v" style="left:320px;top:6px;height:9px"></div>
      <div class="dp-readlabel" style="left:652px;top:13px">PromptBuilder reads each turn: state · summary · event log · audit</div>

      <div class="dp-we" style="left:470px;top:82px;width:216px;height:134px"><div class="dp-we-tab">World Environment</div></div>
      <div class="dp-we-cap" style="left:470px;width:216px;top:224px">↑ the part the developer writes</div>

      <div class="dp-node" id="dp-src" style="left:6px;top:122px;width:150px">
        <div class="nt">Trigger</div><div class="ns">breach · DSR · partner</div></div>
      <div class="dp-node hub" id="dp-runtime" style="left:235px;top:114px;width:170px">
        <div class="nt" style="color:var(--cyan)">AgentRuntime</div><div class="ns">the LLM loop</div></div>
      <div class="dp-badge" id="dp-pb" style="left:233px;top:14px;width:175px">
        <div class="nt">PromptBuilder</div><div class="ns">rebuilds context each turn</div></div>
      <div class="dp-node" id="dp-action" style="left:505px;top:122px;width:150px">
        <div class="nt">@action</div><div class="ns">notify_authority</div></div>
      <div class="dp-node" id="dp-log" style="left:695px;top:122px;width:150px">
        <div class="nt">EventLog</div><div class="ns">CAS + hash chain</div></div>
      <div class="dp-badge cr" id="dp-cr" style="left:683px;top:236px;width:175px">
        <div class="nt">ConflictResolver</div><div class="ns">Continue / Recover / Abandon</div></div>
      <div class="dp-node" id="dp-ns" style="left:900px;top:114px;width:170px">
        <div class="nt" style="color:var(--green)">Namespace</div><div class="ns">4 readable docs</div></div>
    </div>
  </div>
  <div class="card tight" style="margin-top:14px">
    <p style="font-size:14.5px"><b style="color:var(--ink)">Every box but one is a swappable ABC.</b> The <span class="hl-gold">World Environment</span> is the <i>only</i> thing the firm's developer writes — everything else is harness or infrastructure. Each turn the <span class="hl-gold">PromptBuilder</span> rebuilds context from the namespace; on a write conflict the <span class="hl-cyan">ConflictResolver</span> decides what the agent does next.</p>
  </div>
</div>`);

/* ───────────────────────── 5 — NAMESPACE ───────────────────────── */
S(`
<div class="kicker"><span class="num">// 05</span> <span class="dot"></span> Component 1 · Project namespace</div>
<h1>One client = one folder of readable docs</h1>
<div class="body">
  <div class="row" style="gap:18px;align-items:stretch">
    <div class="col" style="flex:0 0 290px;gap:14px">
      <div class="card tight">

S(`
<div class="kicker"><span class="num">// 10</span> <span class="dot"></span> Background · generic concepts</div>
<h1>Event sourcing &amp; optimistic CAS</h1>
<div class="sub">Two ideas that have nothing to do with our harness — they set up the innovation.</div>
<div class="body">
  <div class="grid2" style="align-items:start">
    <div class="card">
      <h3><span class="icoCircle ic-cyan">▤</span> Event sourcing</h3>
      <p style="margin-bottom:10px">Don't store just current state — store the <b style="color:var(--ink)">append-only log of every change</b>. State is a <i>projection</i> of the log; each event has an <b class="hl-cyan">offset</b> (its position). The log is truth; <code class="inl">state.json</code> is a cache.</p>
<div class="tree" style="font-size:12.5px;line-height:1.7"><span class="c">offset 12</span>  assess_breach
<span class="c">offset 13</span>  draft_privacy_policy
<span class="c">offset 14</span>  register_data_subject  <span class="hl-cyan">← head</span></div>
    </div>
    <div class="card">
      <h3><span class="icoCircle ic-gold">⇄</span> Optimistic CAS — no locks</h3>
      <p style="margin-bottom:12px">On write you say <i>"I last saw offset 14."</i> If the log is still at 14, you win → 15. If someone appended first, your compare-and-swap <b class="hl-red">fails</b> and you're handed what you missed.</p>
      <div class="two-offset">
        <div class="writer"><div class="wt">Writer A</div>reads 14 → appends<div class="offtag" style="color:var(--green)">✓ now 15</div></div>
        <div class="writer"><div class="wt">Writer B</div>reads 14 → appends<div class="offtag" style="color:var(--red)">✕ expected 14, got 15</div></div>
      </div>
    </div>
  </div>
  <div class="note" style="margin-top:14px;text-align:center">Locks don't compose across machines or data centres. Optimistic CAS does.</div>
</div>`);

<div class="sub">Three resolutions, one client file — <span class="hl-gold">Acme Health</span>, breach <code class="inl">brc-1a2b</code>.</div>
<div class="body">

      <tr><td class="cap">Vibe-code → prod, same code path</td><td class="yes">Yes</td><td class="no">N/A</td><td class="part">Partial (Azure)</td><td class="no">Opposite</td></tr>

/* ───────────────────────── render ───────────────────────── */
const stage = document.getElementById('stage');
stage.innerHTML = slides.map((h,i)=>`<section class="slide" data-i="${i}">${h}<div class="foot"><span class="t">Distributed Agent Harness</span> · ${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</div><div class="progress" style="width:${(i+1)/slides.length*100}%"></div></section>`).join('');

/* ── data-path animation ── */
let dpTimer=null, dpRunning=false, dpIdx=0, dpCount=0;
const dpTypes=[
  {label:'breach reported',cls:'red'},
  {label:'DSR received',cls:'gold'},
  {label:'partner message',cls:'cyan'},
];
const dpWait=ms=>new Promise(r=>setTimeout(r,ms));
function dpCenter(id,track){
  const el=document.getElementById(id); if(!el)return 0;
  return el.offsetLeft + el.offsetWidth/2;
}
function dpGlow(id,cls){
  const el=document.getElementById(id); if(!el)return;
  el.classList.add(cls||'glow'); setTimeout(()=>el.classList.remove(cls||'glow'),620);
}
async function dpSpawn(){
  const track=document.getElementById('dp-track'); if(!track||!dpRunning)return;
  const t=dpTypes[dpIdx++ % dpTypes.length]; dpCount++;
  const conflict=(dpCount % 4===0);
  const wp=['dp-src','dp-runtime','dp-action','dp-log','dp-ns'].map(id=>dpCenter(id,track));
  const p=document.createElement('div');
  p.className='dp-packet '+t.cls; p.textContent=t.label;
  p.style.left=wp[0]+'px'; p.style.opacity='0'; track.appendChild(p);
  await dpWait(40); if(!p.isConnected)return; p.style.opacity='1'; dpGlow('dp-src');
  await dpWait(180);
  p.style.left=wp[1]+'px'; await dpWait(660); dpGlow('dp-runtime'); dpGlow('dp-pb','glow'); await dpWait(380);
  p.style.left=wp[2]+'px'; await dpWait(660); dpGlow('dp-action'); await dpWait(320);
  p.style.left=wp[3]+'px'; await dpWait(660); dpGlow('dp-log');
  if(conflict){ dpGlow('dp-cr','glow'); p.classList.add('conflict'); await dpWait(820); p.classList.remove('conflict'); }
  else { await dpWait(340); }
  p.style.left=wp[4]+'px'; await dpWait(660); dpGlow('dp-ns','glow-g'); dpReadPulse();
  await dpWait(280); p.style.opacity='0';
  await dpWait(420); p.remove();
}
// The write just landed in the namespace; the next prompt is rebuilt from it.
// A read-dot flows back along the top bus into the PromptBuilder.
async function dpReadPulse(){
  const track=document.getElementById('dp-track'); if(!track||!dpRunning)return;
  const nsX=dpCenter('dp-ns'), pbX=dpCenter('dp-pb');
  const d=document.createElement('div'); d.className='dp-readdot';
  d.style.left=nsX+'px'; d.style.opacity='0'; track.appendChild(d);
  await dpWait(40); if(!d.isConnected)return; d.style.opacity='1';
  await dpWait(120); d.style.left=pbX+'px'; await dpWait(820);
  dpGlow('dp-pb','glow');
  await dpWait(160); d.style.opacity='0';
  await dpWait(360); d.remove();
}
function dpStart(){ if(dpRunning)return; dpRunning=true; dpIdx=0; dpCount=0; dpSpawn(); dpTimer=setInterval(dpSpawn,2100); }
function dpStop(){ dpRunning=false; clearInterval(dpTimer); dpTimer=null;
  const t=document.getElementById('dp-track'); if(t) t.querySelectorAll('.dp-packet,.dp-readdot').forEach(e=>e.remove()); }

let cur = 0;
const secs = [...document.querySelectorAll('.slide')];
// Auto-number kickers from slide order so inserts/removes never desync labels.
// Slide 0 (title) keeps its custom "// technical spike" tag.
secs.forEach((s,i)=>{ if(i>0){ const n=s.querySelector('.kicker .num'); if(n) n.textContent='// '+String(i+1).padStart(2,'0'); } });
function show(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  secs.forEach((s,i)=>s.classList.toggle('active', i===cur));
  location.hash = cur+1;
  if(secs[cur].querySelector('#dp-track')) dpStart(); else dpStop();
}
function fit(){
  const s = Math.min(window.innerWidth/1280, window.innerHeight/720);
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){show(cur+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(cur-1);e.preventDefault();}
  else if(e.key==='Home'){show(0);}
  else if(e.key==='End'){show(slides.length-1);}
  else if(e.key==='f'){document.documentElement.requestFullscreen?.();}
});
document.addEventListener('click', e=>{ if(e.clientX > window.innerWidth*0.5) show(cur+1); else show(cur-1); });
const start = parseInt(location.hash.replace('#',''))||1;
fit(); show(start-1);
if(window.hljs){ hljs.configure({ignoreUnescapedHTML:true}); hljs.highlightAll(); }
</script>
