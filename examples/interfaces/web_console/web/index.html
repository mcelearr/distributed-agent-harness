<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DAH — Web Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161922;
      --border: #262a36;
      --text: #e6e8ee;
      --muted: #8a90a0;
      --accent: #6ea8fe;
      --action: #f0b86c;
      --error: #f06c6c;
      --ok: #6cd49b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      font-size: 14px; }
    body { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 48px 1fr; height: 100vh; }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
      padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
    header h1 { font-size: 14px; font-weight: 600; margin: 0; }
    header .muted { color: var(--muted); font-size: 12px; }
    select { background: #1c2030; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 8px; font-size: 13px; }

    main { display: flex; flex-direction: column; overflow: hidden; }
    #log { flex: 1; overflow-y: auto; padding: 16px; }
    .msg { margin-bottom: 12px; line-height: 1.5; }
    .msg.user { color: var(--accent); }
    .msg.assistant { color: var(--text); }
    .msg.action { color: var(--action); font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px; padding-left: 16px; }
    .msg.result { color: var(--muted); font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px; padding-left: 16px; }
    .msg.error { color: var(--error); }
    .label { color: var(--muted); font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.05em; margin-right: 6px; }

    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
    input[type=text] { flex: 1; background: #1c2030; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; font-size: 14px; }
    button { background: var(--accent); color: #0b0d12; border: 0; border-radius: 6px;
      padding: 8px 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    aside { border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto;
      padding: 12px 16px; }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); margin: 16px 0 8px; }
    aside h2:first-child { margin-top: 0; }
    aside ul { list-style: none; padding: 0; margin: 0; }
    aside li { padding: 4px 0; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px;
      cursor: pointer; color: var(--text); }
    aside li:hover { color: var(--accent); }
    pre#docview { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px; color: var(--muted); margin: 0; max-height: 50vh; overflow-y: auto; }
  </style>
</head>
<body>
  <header>
    <h1>DAH Web Console</h1>
    <span class="muted">/ testing UI — not production</span>
    <span style="flex:1"></span>
    <label class="muted" for="world">world:</label>
    <select id="world"></select>
  </header>

  <main>
    <div id="log"></div>
    <form id="chat-form">
      <input type="text" id="prompt" placeholder="Type a message and press Enter…" autocomplete="off" />
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <aside>
    <h2>Namespace</h2>
    <ul id="docs"></ul>
    <h2 id="docview-title" style="display:none">Document</h2>
    <pre id="docview"></pre>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
